name: Refresh BetAnalytic LIVE

on:
  workflow_dispatch:
  schedule:
    # GitHub native plan A. Cloudflare remains the external backup trigger.
    - cron: "*/5 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: betanalytic-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      THESPORTSDB_KEY: ${{ secrets.THESPORTSDB_KEY }}
      # Used only as a narrow current-date fallback when TheSportsDB misses
      # a candidate that should already be in play.
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-automation.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-automation.txt

      - name: Download currently published static site
        run: |
          mkdir -p live_output
          BASE="https://georgeaalloim.github.io/BetAnalyticBackend"
          BUST="$(date +%s)"
          curl --fail --silent --show-error --location --retry 3 \
            "$BASE/feed.json?v=$BUST" -o live_output/feed.json
          curl --fail --silent --show-error --location --retry 3 \
            "$BASE/manifest.json?v=$BUST" -o live_output/manifest.json
          curl --fail --silent --show-error --location --retry 2 \
            "$BASE/live.json?v=$BUST" -o live_output/previous-live.json || true

      - name: Promote a finished LIVE match to History immediately
        id: promote_ft
        run: |
          python recent_result_sync.py \
            --recent-hours 18 \
            --summary-output live_output/recent_result_sync_summary.json

          UPDATED="$(python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(
              Path("live_output/recent_result_sync_summary.json").read_text(encoding="utf-8")
          )
          print(int(payload.get("updated") or 0))
          PY
          )"

          if [ "$UPDATED" -gt 0 ]; then
            echo "A match reached FT. Rebuilding History immediately."
            python automatic_update_with_recent_results.py \
              --output-dir live_output \
              --skip-sync \
              --skip-detailed-stats \
              --skip-upload
            echo "promoted=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new FT transition in this LIVE cycle."
            echo "promoted=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Persist immediately promoted FT match
        if: steps.promote_ft.outputs.promoted == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            betanalytic.db \
            data/recent_result_sync_summary.json \
            data/recent_history_enrichment_summary.json

          if git diff --cached --quiet; then
            echo "No persistent FT/history diff."
          else
            git commit -m "Promote finished LIVE match to history"
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                exit 1
              fi
              sleep $((attempt * 5))
            done
          fi

      - name: Refresh LIVE data
        run: |
          python live_refresh.py \
            --feed-file live_output/feed.json \
            --output-dir live_output \
            --previous-live-file live_output/previous-live.json
          rm -f live_output/previous-live.json
          rm -f live_output/recent_result_sync_summary.json

      - name: Create landing page
        run: |
          cat > live_output/index.html <<'HTML'
          <!doctype html>
          <html lang="el">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>BetAnalytic Data</title>
          </head>
          <body>
            <h1>BetAnalytic</h1>
            <p>Το δωρεάν αυτόματο feed λειτουργεί.</p>
            <p><a href="manifest.json">manifest.json</a></p>
            <p><a href="feed.json">feed.json</a></p>
            <p><a href="live.json">live.json</a></p>
          </body>
          </html>
          HTML

      - name: Validate JSON
        run: |
          python -m json.tool live_output/feed.json > /dev/null
          python -m json.tool live_output/manifest.json > /dev/null
          python -m json.tool live_output/live.json > /dev/null

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: live_output

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
