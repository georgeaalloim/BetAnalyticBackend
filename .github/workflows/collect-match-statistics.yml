name: Sync free match history

on:
  workflow_dispatch:
  schedule:
    # Καθημερινά στις 03:37 UTC. Χρησιμοποιεί δωρεάν API key, χωρίς πληρωμένο πλάνο.
    - cron: "37 3 * * *"

permissions:
  contents: write

concurrency:
  group: betanalytic-free-history
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-automation.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-automation.txt

      - name: Run tests
        run: |
          python -m unittest discover -p "test_*.py" -v

      - name: Require free API-Football key for complete history
        run: |
          if [ -z "$API_FOOTBALL_KEY" ]; then
            echo "Missing API_FOOTBALL_KEY repository secret."
            echo "Create a free API-Football account and add its key as a GitHub Actions secret."
            exit 1
          fi

      - name: Update completed matches and free CSV statistics
        run: |
          mkdir -p data automation_output
          python automatic_update.py \
            --output-dir automation_output \
            --skip-upload \
            | tee data/free_history_sync_summary.json

      - name: Complete missing statistics and goal scorers
        run: |
          python api_football_history_enricher.py \
            --seasons 2025,2026 \
            --summary-output data/history_enrichment_summary.json

      - name: Audit and clean mixed-provider records
        run: |
          python audit_canonical_statistics.py \
            --report data/canonical_statistics_audit.json

      - name: Validate persisted files
        run: |
          python -m json.tool data/fixture_statistics.json > /dev/null
          python -m json.tool data/free_history_sync_summary.json > /dev/null
          python -m json.tool data/history_enrichment_summary.json > /dev/null
          python -m json.tool data/canonical_statistics_audit.json > /dev/null
          python - <<'PY'
          import sqlite3

          connection = sqlite3.connect("betanalytic.db")
          try:
              fixture_count = connection.execute(
                  "SELECT COUNT(*) FROM fixtures"
              ).fetchone()[0]
              stats_count = connection.execute(
                  "SELECT COUNT(*) FROM fixture_statistics"
              ).fetchone()[0]
          finally:
              connection.close()

          if fixture_count <= 0:
              raise SystemExit("The database contains no fixtures.")
          print("SQLite validation OK:", fixture_count, "fixtures,", stats_count, "statistics")
          PY

      - name: Commit free history updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            betanalytic.db \
            data/fixture_statistics.json \
            data/free_history_sync_summary.json \
            data/history_enrichment_summary.json
            data/canonical_statistics_audit.json

          if git diff --cached --quiet; then
            echo "No new free historical data to commit."
            exit 0
          fi

          git commit -m "Update free match history"

          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying."
            sleep $((attempt * 5))
          done

          echo "Could not push free history after three attempts."
          exit 1

      - name: Upload sync summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-history-sync-summary
          path: |
            data/free_history_sync_summary.json
            data/history_enrichment_summary.json
            data/canonical_statistics_audit.json
          if-no-files-found: error
