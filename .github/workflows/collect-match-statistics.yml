name: Collect corners and cards history

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: "Σεζόν API-Football, χωρισμένες με κόμμα"
        required: true
        default: "2022,2023,2024"
      max_requests:
        description: "Αγώνες/API requests σε αυτή την εκτέλεση (Free: έως 85)"
        required: true
        default: "85"
      request_delay_seconds:
        description: "Παύση μεταξύ requests σε δευτερόλεπτα (Free: 8)"
        required: true
        default: "8"

permissions:
  contents: write

concurrency:
  group: betanalytic-statistics-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-automation.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-automation.txt

      - name: Collect completed-match statistics
        id: collector
        continue-on-error: true
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          python statistics_collector.py \
            --seasons "${{ inputs.seasons }}" \
            --max-requests "${{ inputs.max_requests }}" \
            --request-delay-seconds "${{ inputs.request_delay_seconds }}" \
            --dataset data/fixture_statistics.json \
            --summary-output data/statistics_collection_summary.json

      - name: Validate JSON files
        if: always()
        run: |
          python -m json.tool data/fixture_statistics.json > /dev/null
          python -m json.tool data/statistics_collection_summary.json > /dev/null

      - name: Commit collected statistics
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fixture_statistics.json data/statistics_collection_summary.json

          if git diff --cached --quiet; then
            echo "No new statistics to commit."
            exit 0
          fi

          git commit -m "Update corners and cards history"
          git push origin HEAD:main

      - name: Upload collection summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corners-cards-collection-summary
          path: data/statistics_collection_summary.json
          if-no-files-found: warn

      - name: Fail workflow when collector reported a fatal API error
        if: steps.collector.outcome == 'failure'
        run: |
          echo "The collector saved its partial data and summary, but the API returned a fatal error."
          exit 1
