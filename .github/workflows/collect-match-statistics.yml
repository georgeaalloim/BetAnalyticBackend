name: Sync free match history

on:
  workflow_dispatch:
  schedule:
    # Daily persistence/backfill. The public feed itself gets recent FT results
    # every 15 minutes from update-betanalytic.yml.
    - cron: "37 3 * * *"

permissions:
  contents: write

concurrency:
  group: betanalytic-free-history
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      THESPORTSDB_KEY: ${{ secrets.THESPORTSDB_KEY }}

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-automation.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-automation.txt

      - name: Run tests
        run: |
          python -m unittest discover -p "test_*.py" -v

      - name: Update completed matches and free CSV statistics
        run: |
          mkdir -p data automation_output

          # The wrapper prints more than one JSON object, so stdout is a log.
          python automatic_update_with_recent_results.py \
            --output-dir automation_output \
            --skip-upload \
            | tee /tmp/free_history_sync.log

          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          def load_object(path_string):
              path = Path(path_string)
              if not path.exists():
                  return {}
              value = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(value, dict):
                  raise SystemExit(f"{path} must contain one JSON object.")
              return value

          payload = {
              "status": "ok",
              "generated_at": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "recent_result_sync": load_object(
                  "data/recent_result_sync_summary.json"
              ),
              "recent_history_enrichment": load_object(
                  "data/recent_history_enrichment_summary.json"
              ),
          }

          Path("data/free_history_sync_summary.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Complete missing statistics and goal scorers
        run: |
          # API-Football's recent-date endpoint currently requires season together
          # with date. The backend fallback historically sent only league+date,
          # causing: "The Season field is required."
          #
          # Keep the backend logic unchanged here, but use a Session that injects
          # the correct Greek-league season only for date-fallback /fixtures calls.
          python - <<'PY'
          import json
          import os
          from dataclasses import asdict
          from datetime import date, datetime
          from pathlib import Path

          import requests

          from api_football_history_enricher import enrich_history
          from fixtur_es_source import season_from_local_date
          from zoneinfo import ZoneInfo

          ATHENS_TZ = ZoneInfo("Europe/Athens")

          class DateFallbackSeasonSession(requests.Session):
              def get(self, url, **kwargs):
                  params = dict(kwargs.get("params") or {})
                  if (
                      url.rstrip("/").endswith("/fixtures")
                      and params.get("date")
                      and params.get("season") is None
                  ):
                      try:
                          local_match_date = date.fromisoformat(str(params["date"]))
                          params["season"] = season_from_local_date(local_match_date)
                      except ValueError:
                          pass
                  kwargs["params"] = params
                  return super().get(url, **kwargs)

          current_season = season_from_local_date(
              datetime.now(ATHENS_TZ).date()
          )

          session = DateFallbackSeasonSession()
          try:
              result = enrich_history(
                  seasons=(current_season - 1, current_season),
                  api_key=os.getenv("API_FOOTBALL_KEY"),
                  session=session,
                  date_fallback_days=45,
              )
          finally:
              session.close()

          payload = asdict(result)
          output = Path("data/history_enrichment_summary.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(payload, ensure_ascii=False, indent=2))

          # Do not mark the workflow failed just because an older date is outside
          # the free-plan window. Recent accessible matches should still be saved.
          PY

      - name: Audit and clean mixed-provider records
        run: |
          python audit_canonical_statistics.py \
            --report data/canonical_statistics_audit.json

      - name: Validate persisted files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = [
              "data/fixture_statistics.json",
              "data/free_history_sync_summary.json",
              "data/recent_result_sync_summary.json",
              "data/recent_history_enrichment_summary.json",
              "data/history_enrichment_summary.json",
              "data/canonical_statistics_audit.json",
          ]

          for filename in files:
              path = Path(filename)
              if not path.exists():
                  raise SystemExit(f"Missing JSON file: {filename}")
              try:
                  value = json.loads(path.read_text(encoding="utf-8"))
              except json.JSONDecodeError as error:
                  raise SystemExit(
                      f"Invalid JSON in {filename}: "
                      f"line {error.lineno}, column {error.colno}: {error.msg}"
                  ) from error
              if not isinstance(value, dict):
                  raise SystemExit(f"{filename} must contain one JSON object.")
              print(f"JSON OK: {filename}")
          PY

          python - <<'PY'
          import sqlite3

          connection = sqlite3.connect("betanalytic.db")
          try:
              fixture_count = connection.execute(
                  "SELECT COUNT(*) FROM fixtures"
              ).fetchone()[0]
              stats_count = connection.execute(
                  "SELECT COUNT(*) FROM fixture_statistics"
              ).fetchone()[0]
              history_details_count = connection.execute(
                  "SELECT COUNT(*) FROM fixture_history_details"
              ).fetchone()[0]
          finally:
              connection.close()

          if fixture_count <= 0:
              raise SystemExit("The database contains no fixtures.")

          print(
              "SQLite validation OK:",
              fixture_count,
              "fixtures,",
              stats_count,
              "canonical statistics,",
              history_details_count,
              "API history detail snapshots",
          )
          PY

      - name: Commit free history updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            betanalytic.db \
            data/fixture_statistics.json \
            data/free_history_sync_summary.json \
            data/recent_result_sync_summary.json \
            data/recent_history_enrichment_summary.json \
            data/history_enrichment_summary.json \
            data/canonical_statistics_audit.json

          if git diff --cached --quiet; then
            echo "No new free historical data to commit."
            exit 0
          fi

          git commit -m "Update free match history"

          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying."
            sleep $((attempt * 5))
          done

          echo "Could not push free history after three attempts."
          exit 1

      - name: Upload sync summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-history-sync-summary
          path: |
            data/free_history_sync_summary.json
            data/recent_result_sync_summary.json
            data/recent_history_enrichment_summary.json
            data/history_enrichment_summary.json
            data/canonical_statistics_audit.json
          if-no-files-found: error
