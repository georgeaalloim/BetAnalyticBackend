name: Rebuild clean database

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type REBUILD to replace betanalytic.db after all checks pass"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: betanalytic-clean-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}

    steps:
      - name: Require explicit confirmation
        run: |
          if [ "${{ inputs.confirmation }}" != "REBUILD" ]; then
            echo "The confirmation value must be exactly REBUILD."
            exit 1
          fi

      - name: Checkout main branch
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-automation.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-automation.txt

      - name: Run all tests
        run: |
          python -m unittest discover -p "test_*.py" -v

      - name: Rebuild in isolation and replace only after validation
        run: |
          mkdir -p data
          python clean_rebuild.py --apply \
            --report data/clean_rebuild_report.json \
            --manual-report data/manual_verification_report.json \
            --quarantine data/quarantined_statistics.json \
            --queue data/manual_verification_queue.csv

      - name: Validate clean outputs
        run: |
          python -m json.tool data/fixture_statistics.json > /dev/null
          python -m json.tool data/clean_rebuild_report.json > /dev/null
          python -m json.tool data/manual_verification_report.json > /dev/null
          python -m json.tool data/quarantined_statistics.json > /dev/null
          python - <<'PY'
          import json
          import sqlite3
          from pathlib import Path

          report = json.loads(
              Path("data/clean_rebuild_report.json").read_text(encoding="utf-8")
          )
          if report.get("status") != "ready":
              raise SystemExit("Clean rebuild report is not ready.")
          if report.get("production_replaced") is not True:
              raise SystemExit("The production database was not replaced.")
          critical = report.get("quality", {}).get("critical_errors", [])
          if critical:
              raise SystemExit("Critical clean rebuild errors: " + str(critical))

          connection = sqlite3.connect("betanalytic.db")
          try:
              foreign_keys = connection.execute("PRAGMA foreign_key_check").fetchall()
              duplicates = connection.execute(
                  """
                  SELECT COUNT(*) FROM (
                      SELECT season, substr(fixture_date, 1, 10),
                             lower(home_team_name), lower(away_team_name)
                      FROM fixtures
                      GROUP BY season, substr(fixture_date, 1, 10),
                               lower(home_team_name), lower(away_team_name)
                      HAVING COUNT(*) > 1
                  )
                  """
              ).fetchone()[0]
              fixture_count = connection.execute(
                  "SELECT COUNT(*) FROM fixtures"
              ).fetchone()[0]
              stats_count = connection.execute(
                  "SELECT COUNT(*) FROM fixture_statistics"
              ).fetchone()[0]
          finally:
              connection.close()

          if foreign_keys:
              raise SystemExit("Foreign-key errors remain after rebuild.")
          if duplicates:
              raise SystemExit("Duplicate natural fixture keys remain after rebuild.")
          if fixture_count <= 0:
              raise SystemExit("The clean database has no fixtures.")
          print("Clean database OK:", fixture_count, "fixtures,", stats_count, "statistics")
          PY

      - name: Commit clean database and audit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            betanalytic.db \
            data/fixture_statistics.json \
            data/manual_verified_matches.json \
            data/clean_rebuild_report.json \
            data/manual_verification_report.json \
            data/quarantined_statistics.json \
            data/manual_verification_queue.csv

          if git diff --cached --quiet; then
            echo "No clean rebuild changes to commit."
            exit 0
          fi

          git commit -m "Rebuild and validate clean match database"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying."
            sleep $((attempt * 5))
          done
          exit 1

      - name: Upload clean rebuild evidence and backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clean-database-rebuild
          path: |
            data/clean_rebuild_report.json
            data/manual_verification_report.json
            data/quarantined_statistics.json
            data/manual_verification_queue.csv
            clean_rebuild_backup/
            clean_rebuild_work/*/automation_output/feed.json
            clean_rebuild_work/*/automation_output/manifest.json
          if-no-files-found: warn
