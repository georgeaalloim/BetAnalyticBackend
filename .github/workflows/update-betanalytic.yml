name: Update and publish BetAnalytic data

on:
  workflow_dispatch:
  schedule:
    # Main feed every 15 minutes. Every run re-reads Football-Data.co.uk,
    # so recent FT statistics are retried automatically until published.
    - cron: "7,22,37,52 * * * *"
  workflow_run:
    workflows:
      - Sync free match history
      - Rebuild clean database
    types:
      - completed

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: betanalytic-pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      BETANALYTIC_LOOKAHEAD_DAYS: ${{ vars.BETANALYTIC_LOOKAHEAD_DAYS }}
      THESPORTSDB_KEY: ${{ secrets.THESPORTSDB_KEY }}
      # API_FOOTBALL_KEY is intentionally NOT exposed here.
      # The current free plan blocks the active seasons, so scheduled refreshes
      # use TheSportsDB for recent FT/scorers and Football-Data.co.uk for stats.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-automation.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-automation.txt

      - name: Run tests
        run: |
          python -m unittest discover -p "test_*.py" -v

      - name: Sync recent finals and retry free detailed statistics
        run: |
          python automatic_update_with_recent_results.py \
            --output-dir automation_output \
            --skip-upload

      - name: Preserve latest LIVE snapshot
        run: |
          BASE="https://georgeaalloim.github.io/BetAnalyticBackend"
          BUST="$(date +%s)"
          if ! curl --fail --silent --show-error --location --retry 2 \
            "$BASE/live.json?v=$BUST" -o automation_output/live.json; then
            python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          payload = {
              "schema_version": 1,
              "generated_at": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "refresh_interval_seconds": 300,
              "source": {
                  "name": "TheSportsDB API v1",
                  "mode": "free live lookup",
                  "paid_subscription_required": False,
                  "premium_livescore_endpoint_used": False,
              },
              "candidates_considered": 0,
              "matches_count": 0,
              "requests_used": 0,
              "matches": [],
              "warnings": ["No previous LIVE snapshot was available during full feed publish."],
          }
          Path("automation_output/live.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          fi

      - name: Audit canonical statistics snapshots
        run: |
          python audit_canonical_statistics.py \
            --report data/canonical_statistics_audit.json

      - name: Persist newly finished matches and recent history details
        run: |
          SHOULD_COMMIT="$(python - <<'PY'
          import json
          from pathlib import Path

          def load(path):
              try:
                  return json.loads(Path(path).read_text(encoding="utf-8"))
              except Exception:
                  return {}

          recent = load("data/recent_result_sync_summary.json")
          history = load("data/recent_history_enrichment_summary.json")
          changed = (
              int(recent.get("updated") or 0) > 0
              or int(recent.get("scorer_sets_saved") or 0) > 0
              or int(history.get("matches_enriched") or 0) > 0
          )
          print("yes" if changed else "no")
          PY
          )"

          if [ "$SHOULD_COMMIT" != "yes" ]; then
            echo "No newly finished/history-enriched match to persist."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            betanalytic.db \
            data/recent_result_sync_summary.json \
            data/recent_history_enrichment_summary.json \
            data/canonical_statistics_audit.json

          if git diff --cached --quiet; then
            echo "No persistent DB/history diff."
            exit 0
          fi

          git commit -m "Persist recent completed match history"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "History persistence push attempt ${attempt} failed; retrying."
            sleep $((attempt * 5))
          done
          exit 1

      - name: Validate generated feed semantics
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path

          feed = json.loads(Path("automation_output/feed.json").read_text(encoding="utf-8"))
          manifest = json.loads(Path("automation_output/manifest.json").read_text(encoding="utf-8"))

          fixture_summary = feed.get("sync_summary", {}).get("fixtures", {})
          if str(fixture_summary.get("source_key") or "") != "free_cross_checked_schedule":
              raise SystemExit("Unexpected fixture source.")

          automatic_mode = feed.get("sync_summary", {}).get("automatic_mode", {})
          if automatic_mode.get("paid_api_required") is not False:
              raise SystemExit("The feed must not require a paid API.")
          if automatic_mode.get("api_secret_required") is not False:
              raise SystemExit("The feed must not require an API secret.")
          if automatic_mode.get("superleague_scraping") is not False:
              raise SystemExit("Super League website scraping must remain disabled.")

          fixtures = [
              fixture
              for season in feed.get("seasons", [])
              for fixture in season.get("fixtures", [])
          ]
          if int(feed.get("fixtures_count", -1)) != len(fixtures):
              raise SystemExit("fixtures_count does not match fixtures array.")
          if any(
              fixture.get("prediction_status") not in {"ready", "unavailable"}
              for fixture in fixtures
          ):
              raise SystemExit("Unexpected prediction_status.")

          for fixture in fixtures:
              datetime.fromisoformat(str(fixture["fixture_date"]).replace("Z", "+00:00"))
              source = str(fixture.get("schedule_source") or "").lower()
              if "slgr" in source or "super league official" in source:
                  raise SystemExit("Forbidden Super League scraping source found.")

          history = feed.get("history")
          if not isinstance(history, dict):
              raise SystemExit("History missing.")
          default_season = int(history.get("default_season", -1))
          if default_season < 2000:
              raise SystemExit("Invalid history season.")

          history_seasons = {
              int(item.get("season"))
              for item in history.get("seasons", [])
          }
          if history_seasons != {default_season}:
              raise SystemExit("History must expose only the active season.")

          for season in history.get("seasons", []):
              matches = season.get("matches", [])
              if int(season.get("matches_count", -1)) != len(matches):
                  raise SystemExit("History matches_count mismatch.")
              for match in matches:
                  if match.get("status") != "FT":
                      raise SystemExit("History contains a non-FT match.")
                  score = match.get("score") or {}
                  if score.get("home") is None or score.get("away") is None:
                      raise SystemExit("History FT match missing score.")
                  if match.get("statistics_source_consistent") is not True:
                      raise SystemExit("History contains mixed-source statistics.")

          if not manifest.get("feed_sha256"):
              raise SystemExit("manifest.json missing feed_sha256.")

          print(
              "Feed validation OK:",
              len(fixtures),
              "upcoming fixtures,",
              sum(item.get("matches_count", 0) for item in history.get("seasons", [])),
              "history matches",
          )
          PY

      - name: Prepare GitHub Pages files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          output_dir = Path("automation_output")
          manifest_path = output_dir / "manifest.json"
          base_url = "https://georgeaalloim.github.io/BetAnalyticBackend"

          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["feed_url"] = f"{base_url}/feed.json"
          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          index_html = """<!doctype html>
          <html lang="el">
          <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>BetAnalytic Data</title>
          </head>
          <body>
              <h1>BetAnalytic</h1>
              <p>Το δωρεάν αυτόματο feed λειτουργεί.</p>
              <p><a href="manifest.json">manifest.json</a></p>
              <p><a href="feed.json">feed.json</a></p>
              <p><a href="live.json">live.json</a></p>
          </body>
          </html>
          """
          (output_dir / "index.html").write_text(index_html, encoding="utf-8")
          PY

      - name: Validate generated JSON
        run: |
          python -m json.tool automation_output/manifest.json > /dev/null
          python -m json.tool automation_output/feed.json > /dev/null
          python -m json.tool automation_output/live.json > /dev/null

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: automation_output

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
