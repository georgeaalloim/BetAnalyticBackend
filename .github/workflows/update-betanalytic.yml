name: Update and publish BetAnalytic data

on:
  workflow_dispatch:

  schedule:
    # Εκτέλεση ανά δύο ώρες, στο λεπτό 17.
    # Το cron του GitHub χρησιμοποιεί ώρα UTC.
    - cron: "17 */2 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: betanalytic-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-automation.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-automation.txt

      - name: Update fixtures and generate predictions
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}

        run: |
          python automatic_update.py \
            --output-dir automation_output \
            --skip-upload

      - name: Prepare GitHub Pages files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          output_dir = Path("automation_output")
          manifest_path = output_dir / "manifest.json"

          base_url = (
              "https://georgeaalloim.github.io/"
              "BetAnalyticBackend"
          )

          manifest = json.loads(
              manifest_path.read_text(encoding="utf-8")
          )

          manifest["feed_url"] = f"{base_url}/feed.json"

          manifest_path.write_text(
              json.dumps(
                  manifest,
                  ensure_ascii=False,
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )

          index_html = """<!doctype html>
          <html lang="el">
          <head>
              <meta charset="utf-8">
              <meta name="viewport"
                    content="width=device-width, initial-scale=1">
              <title>BetAnalytic Data</title>
          </head>
          <body>
              <h1>BetAnalytic</h1>
              <p>Το αυτόματο feed λειτουργεί.</p>
              <p><a href="manifest.json">manifest.json</a></p>
              <p><a href="feed.json">feed.json</a></p>
          </body>
          </html>
          """

          (output_dir / "index.html").write_text(
              index_html,
              encoding="utf-8",
          )
          PY

      - name: Validate generated JSON
        run: |
          python -m json.tool \
            automation_output/manifest.json > /dev/null

          python -m json.tool \
            automation_output/feed.json > /dev/null

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: automation_output

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
